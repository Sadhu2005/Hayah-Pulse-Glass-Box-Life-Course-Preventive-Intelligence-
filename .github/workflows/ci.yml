# Parent workflow — Actions UI shows nested jobs in ONE column/box
# (same pattern as staging-pipeline.yml grouping).
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline
    uses: ./.github/workflows/test-pipeline.yml
