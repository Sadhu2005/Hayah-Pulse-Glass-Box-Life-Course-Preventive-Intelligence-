# One vertical box in Actions UI (matrix group), suites run one-by-one.
# Looks like staging-pipeline: stacked list in a single card — not a long horizontal chain.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        suite:
          - lint
          - unit
          - integration
          - functional
          - regression
          - blackbox
          - e2e
          - all
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        if: matrix.suite == 'e2e' || matrix.suite == 'all'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: python -m pip install -r backend/requirements.txt

      - name: lint
        if: matrix.suite == 'lint'
        run: |
          python -m compileall -q backend/app backend/engine backend/scripts
          python scripts/ci/check_config_yaml.py
          python scripts/ci/check_secret_patterns.py
          python scripts/ci/check_doc_config_drift.py
          python scripts/ci/check_doc_links.py
          python scripts/ci/check_message_templates.py


      - name: unit
        if: matrix.suite == 'unit'
        working-directory: backend
        run: python -m pytest tests/unit -q --tb=short

      - name: integration
        if: matrix.suite == 'integration'
        working-directory: backend
        run: python -m pytest tests/integration -q --tb=short

      - name: Ensure synthetic data
        if: matrix.suite == 'functional' || matrix.suite == 'blackbox' || matrix.suite == 'e2e' || matrix.suite == 'all'
        run: |
          python backend/scripts/generate_synthetic_cohort.py
          python backend/scripts/run_engine.py

      - name: functional
        if: matrix.suite == 'functional'
        working-directory: backend
        run: python -m pytest tests/functional -q --tb=short

      - name: regression
        if: matrix.suite == 'regression'
        working-directory: backend
        run: python -m pytest tests/regression -q --tb=short

      - name: blackbox
        if: matrix.suite == 'blackbox'
        working-directory: backend
        run: python -m pytest tests/blackbox -q --tb=short

      - name: e2e evaluate artifacts
        if: matrix.suite == 'e2e' || matrix.suite == 'all'
        run: python backend/scripts/run_evaluation.py

      - name: e2e
        if: matrix.suite == 'e2e'
        working-directory: backend
        run: python -m pytest tests/e2e -q --tb=short

      - name: e2e frontend build
        if: matrix.suite == 'e2e'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: all — evaluation gates
        if: matrix.suite == 'all'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/synthetic/evaluation_report.json").read_text())
          assert report["pass"]["lift_positive"] is True
          assert report["pass"]["zero_small_cell_leaks"] is True
          print("all: evaluation gates ok")
          PY

      - name: all — full pytest
        if: matrix.suite == 'all'
        working-directory: backend
        run: python -m pytest tests -q --tb=short
